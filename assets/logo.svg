<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 200" width="560" height="200" role="img" aria-label="SyncDB">
  <defs>
    <linearGradient id="dbA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4FC3F7"/><stop offset="1" stop-color="#1976D2"/>
    </linearGradient>
    <linearGradient id="dbB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4DD0A5"/><stop offset="1" stop-color="#00897B"/>
    </linearGradient>
    <linearGradient id="arc" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1976D2"/><stop offset="1" stop-color="#00897B"/>
    </linearGradient>
  </defs>

  <!-- left database -->
  <g transform="translate(26,44)">
    <ellipse cx="42" cy="16" rx="42" ry="15" fill="url(#dbA)"/>
    <path d="M0 16 V 96 a42 15 0 0 0 84 0 V 16 a42 15 0 0 1 -84 0 Z" fill="url(#dbA)" opacity=".88"/>
    <ellipse cx="42" cy="48" rx="42" ry="15" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="2.5"/>
    <ellipse cx="42" cy="74" rx="42" ry="15" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="2.5"/>
  </g>

  <!-- sync arrows -->
  <g fill="none" stroke="url(#arc)" stroke-width="9" stroke-linecap="round">
    <path d="M132 86 q50 -34 100 0"/>
    <path d="M232 118 q-50 34 -100 0"/>
  </g>
  <path d="M232 86 l-16 -9 v18 Z" fill="#00897B"/>
  <path d="M132 118 l16 9 v-18 Z" fill="#1976D2"/>

  <!-- right database -->
  <g transform="translate(248,44)">
    <ellipse cx="42" cy="16" rx="42" ry="15" fill="url(#dbB)"/>
    <path d="M0 16 V 96 a42 15 0 0 0 84 0 V 16 a42 15 0 0 1 -84 0 Z" fill="url(#dbB)" opacity=".88"/>
    <ellipse cx="42" cy="48" rx="42" ry="15" fill="none" stroke="#fff" stroke-opacity=".45" stroke-width="2.5"/>
    <ellipse cx="42" cy="74" rx="42" ry="15" fill="none" stroke="#fff" stroke-opacity=".3" stroke-width="2.5"/>
  </g>

  <!-- wordmark -->
  <text x="366" y="104" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="52" font-weight="700" fill="#1976D2">Sync</text>
  <text x="366" y="104" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="52" font-weight="700" fill="#00897B" dx="124">DB</text>
  <text x="368" y="136" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif"
        font-size="16" letter-spacing="1.4" fill="#5C7080">SQL SERVER SYNC</text>
</svg>
